<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="imgs2/title.webp">
    <title>Things I Wanted To Say - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="bg-pic">
        <img src="imgs2/pink-flower-field.webp" alt="">
    </div>
    <div class="sparkle">
        <img src="imgs/sparkle2.gif" alt="">
    </div>
    <div class="logo">
        <img src="imgs2/title.webp" alt="logo">
    </div>
    <div class="form-container">
        <form onsubmit="return validate(event)">
            <div class="cont">
                <label for="Nickname">Enter your nickname:</label>
                <input type="text" id="Nickname" required>
                <label for="Birthdate">Your birthdate:</label>
                <input type="date" id="Birthdate" required>
                <div class="error-message" id="error-msg">Invalid nickname</div>
                <button type="submit">Log in</button>
            </div>
        </form>
    </div>

</body>
</html>
