<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="imgs/title.png">
    <title>Things I Wanted To Say - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

    <style>
        @media (max-width: 600px) {
            .cont {
                width: 85%;
                padding: 15px;
            }

            label {
                font-size: 1rem;
                margin-left: 10px;
            }

            input {
                height: 35px;
                font-size: 0.9rem;
                margin: 0 5px 10px 5px;
                padding: 0 10px;
                width: calc(100% - 30px);
            }

            button {
                height: 35px;
                font-size: 0.9rem;
                width: 60%;
            }

            .logo img {
                width: 60%;
                min-width: 180px;
            }
        }

        @media (min-width: 601px) {
            .logo {
                margin-bottom: 30px;
            }
        }

        ::-webkit-scrollbar{
            display: none;
            
        }
        body {
            font-family: 'Schoolbell', cursive;
            background: #f7e7eb;
            overflow-y: hidden;
            min-height: 100vh;
            display: flex;
            
            align-items: center;
            position: relative;
            flex-direction: column;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .cont {
            display: flex;
            flex-direction: column;
            justify-content: center;
            top: 50%;
            width: 90%;
            height: auto;
            background-color: rgba(255, 192, 203, 0.080);
            padding: 20px;
            border-radius: 24px;
            opacity: calc(90%);
            backdrop-filter: blur(6px);
            box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.1);
        }

        label{
            color: black;
            margin-left: 20px;
            margin-bottom: 6px;
            font-size: 1rem;
            text-align: left;
        }

        input {
            font-family: 'Schoolbell', cursive;
            height: 40px;
            font-size: 1rem;
            margin: 0 10px 10px 10px;
            padding: 0 15px;
            border-radius: 12px;
            outline: none;
            border: 2px solid #ffb6c1;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
            width: calc(100% - 30px);
            box-sizing: border-box;
            align-self: center;
        }

        button {
            margin: 20px auto;
            width: 50%;
            max-width: 200px;
            height: 40px;
            border-radius: 20px;
            font-family: 'Schoolbell', cursive;
            font-size: 1rem;
            cursor: pointer;
            background-color: #f7e7eb;
            transition: transform 0.2s ease;
            outline: none;
            border: 2px solid #ffb6c1;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        button:hover {
            background-color: white;
            transform: scale(1.1);
        }

        .logo  {
            margin-top: 5%;
            margin-bottom: 1px;
            text-align: center;
            
        }
        .logo img{
            width: 70%;
            max-width: 300px;
            min-width: 200px;
            height: auto;
        }

        .error-message {
            color: red;
            margin-left: 3vh;
            visibility: hidden;
            font-size: small;
            transition: visibility 0s, opacity 0.3s ease;
            opacity: 0;
        }

        .sparkle{
            position: absolute;
            
        }
        .sparkle img{
            mix-blend-mode: screen;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            display: block;
            z-index: 10;
            
            opacity: 70%;
        }
        .bg-pic {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .bg-pic img {
            width: 110%;
            height: 110%;
            object-fit: cover;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="bg-pic">
        <img src="imgs/pink-flower-field.jpg" alt="">
    </div>
    <div class="sparkle">
        <img src="imgs/sparkle2.gif" alt="">
    </div>
    <div class="logo">
        <img src="imgs/title.png" alt="logo">
    </div>
    <div class="form-container">
        <form onsubmit="return validate(event)">
            <div class="cont">
                <label for="Nickname">Enter your nickname:</label>
                <input type="text" id="Nickname" required>
                <label for="Birthdate">Your birthdate:</label>
                <input type="date" id="Birthdate" required>
                <div class="error-message" id="error-msg">Invalid nickname</div>
                <button type="submit">Log in</button>
            </div>
        </form>
    </div>

    <script>
        function validate(event) {
            event.preventDefault();

            const nickname = document.getElementById("Nickname").value.trim().toLowerCase();
            const birthdate = document.getElementById("Birthdate").value;
            const errorDiv = document.getElementById("error-msg");

            if (nickname === "alli" && birthdate === "2007-01-18") {
                window.location.href = "main.html";
            } else {
                errorDiv.textContent = "Incorrect nickname or birthdate.";
                errorDiv.style.visibility = "visible";
                errorDiv.style.opacity = "1";
            }
        }
        
    </script>
</body>
</html>
