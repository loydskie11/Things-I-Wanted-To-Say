<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="imgs/title.png">
    <title>Things I Wanted To Say - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">

    <style>
        @media (max-width: 600px) {
        .cont {
            width: 80vw;
        }
        }

        ::-webkit-scrollbar{
            display: none;
            
        }
        body {
            font-family: 'Schoolbell', cursive;
            background: #f7e7eb;
            overflow-y: hidden;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .cont {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform: translate(-50%, -50%);
            width: 50vh;
            height: auto;
            background-color: rgba(255, 192, 203, 0.080);
            padding: 20px;
            border-radius: 24px;
            opacity: calc(90%);
            margin-top: 4vw;
            backdrop-filter: blur(6px);
            box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.1);
        }

        label{
            color: black;
            margin-left: 3vh;
            margin-bottom: 6px;
        }

        input {
            font-family: 'Schoolbell', cursive;
            height: 5vh;
            font-size: medium;
            margin: 0vh 2vh 2vh 2vh;
            padding-left: 4%;
            padding-right: 4%;
            border-radius: 12px;
            outline: none;
            border: 2px solid #ffb6c1;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        button {
            margin: 4vh 15vh 0vh 15vh;
            height: 5vh;
            border-radius: 2vh;
            font-family: 'Schoolbell', cursive;
            cursor: pointer;
            background-color: #f7e7eb;
            transition: transform 0.2s ease;
            outline: none;
            border: 2px solid #ffb6c1;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        button:hover {
            background-color: white;
            transform: scale(1.1);
        }

        .logo  {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            
        }
        .logo img{
            width: 30vw;
            min-width: 300px;
            height: auto;
            object-position: center;
        }

        .error-message {
            color: red;
            margin-left: 3vh;
            visibility: hidden;
            font-size: small;
            transition: visibility 0s, opacity 0.3s ease;
            opacity: 0;
        }

        .sparkle{
            position: absolute;
            
        }
        .sparkle img{
            mix-blend-mode: screen;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            display: block;
            z-index: 10;
            
            opacity: 70%;
        }
        .bg-pic {
            position: absolute;
            right: 1px;
        }
        .bg-pic img {
            width: 110vw;
            height: 110vh;
            object-fit: cover;
            object-position: center;
            background-repeat: no-repeat;
            z-index: 9;
            opacity: 30%;
        }
    </style>
</head>
<body>
    <div class="bg-pic">
        <img src="imgs/pink-flower-field.jpg" alt="">
    </div>
    <div class="sparkle">
        <img src="imgs/sparkle2.gif" alt="">
    </div>
    <div class="logo">
        <img src="imgs/title.png" alt="logo">
    </div>
    <div class="form-container">
        <form onsubmit="return validate(event)">
            <div class="cont">
                <label for="Nickname">Enter your nickname:</label>
                <input type="text" id="Nickname" required>
                <label for="Birthdate">Your birthdate:</label>
                <input type="date" id="Birthdate" required>
                <div class="error-message" id="error-msg">Invalid nickname</div>
                <button type="submit">Log in</button>
            </div>
        </form>
    </div>

    <script>
        function validate(event) {
            event.preventDefault();

            const nickname = document.getElementById("Nickname").value.trim().toLowerCase();
            const birthdate = document.getElementById("Birthdate").value;
            const errorDiv = document.getElementById("error-msg");

            if (nickname === "alli" && birthdate === "2007-01-18") {
                window.location.href = "main.html";
            } else {
                errorDiv.textContent = "Incorrect nickname or birthdate.";
                errorDiv.style.visibility = "visible";
                errorDiv.style.opacity = "1";
            }
        }
        
    </script>
</body>
</html>
